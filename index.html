<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day / Night Toggle</title>
  <link rel="stylesheet" href="day-night-toggle.css" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 32px;
      align-content: center;
      font-family: Inter, system-ui, sans-serif;
      background: #ececec;
      color: #333;
      transition: background 650ms cubic-bezier(0.65, 0, 0.25, 1), color 650ms;
    }
    body.night { background: #24242b; color: #c9c9d1; }
    .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .small { --dn-size: 64px; }
    .tiny { --dn-size: 32px; }
    p { margin: 0; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <button class="dn-toggle" id="main"></button>
  <div class="row">
    <button class="dn-toggle small"></button>
    <button class="dn-toggle tiny"></button>
  </div>
  <p>Click or press Space / Enter. Scale with <code>--dn-size</code>.</p>

  <script src="day-night-toggle.js"></script>
  <script>
    document.getElementById("main").addEventListener("dn-change", (e) => {
      document.body.classList.toggle("night", e.detail.night);
    });
  </script>
</body>
</html>
